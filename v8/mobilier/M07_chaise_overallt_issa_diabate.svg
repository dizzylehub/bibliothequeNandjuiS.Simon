 style="filter:brightness(1.0)"/><polygon points="1146.0,369.0 1265.3,300.2 1265.3,293.9 1146.0,362.8" fill="#d8b98a" fill-opacity="1" stroke="#2a2622" stroke-width="0.6" style="filter:brightness(0.85)"/><polygon points="1146.0,369.0 1054.4,316.1 1054.4,309.9 1146.0,362.8" fill="#d8b98a" fill-opacity="1" stroke="#2a2622" stroke-width="0.6" style="filter:brightness(0.68)"/><polygon points="1148.2,340.8 1256.0,278.6 1176.9,233.0 1069.2,295.2" fill="#efe4cc" fill-opacity="1" stroke="#2a2622" stroke-width="0.6" style="filter:brightness(1.0)"/><polygon points="1148.2,357.4 1256.0,295.2 1256.0,278.6 1148.2,340.8" fill="#efe4cc" fill-opacity="1" stroke="#2a2622" stroke-width="0.6" style="filter:brightness(0.85)"/><polygon points="1148.2,357.4 1069.2,311.8 1069.2,295.2 1148.2,340.8" fill="#efe4cc" fill-opacity="1" stroke="#2a2622" stroke-width="0.6" style="filter:brightness(0.68)"/><polygon points="1150.0,327.3 1153.2,325.5 1036.5,258.1 1033.2,259.9" fill="#d8b98a" fill-opacity="1" stroke="#2a2622" stroke-width="0.6" style="filter:brightness(1.0)"/><polygon points="1150.0,431.0 1153.2,429.2 1153.2,325.5 1150.0,327.3" fill="#d8b98a" fill-opacity="1" stroke="#2a2622" stroke-width="0.6" style="filter:brightness(0.85)"/><polygon points="1150.0,431.0 1033.2,363.6 1033.2,259.9 1150.0,327.3" fill="#d8b98a" fill-opacity="1" stroke="#2a2622" stroke-width="0.6" style="filter:brightness(0.68)"/><text x="70" y="52" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#2a2622" text-anchor="start">M07 · Chaise ÖVERALLT d’Issa Diabaté (IKEA, 2019)</text><text x="70" y="78" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b8a86" text-anchor="start">Désiré Akai (rôle IA) · fiche mobilier · V8 indice B · modèle d’étude à prototyper, cotes en mètres</text><text x="70" y="100" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b0582b" text-anchor="start">Volume d’encombrement seulement : la découpe réelle du modèle n’est pas relevée ; à dessiner d’après un exemplaire ou les plans de l’auteur.</text><text x="920" y="620" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2a2622" text-anchor="start">Retenue pour la terrasse-salon : un fauteuil bas découpé dans un</text><text x="920" y="641" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2a2622" text-anchor="start">seul panneau de contreplaqué, sans vis ni colle, dessiné par Issa</text><text x="920" y="662" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2a2622" text-anchor="start">Diabaté pour inviter à converser. Cinq exemplaires autour des</text><text x="920" y="683" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2a2622" text-anchor="start">tables basses.</text><text x="920" y="718" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8b8a86" text-anchor="start">MATIÈRES</text><text x="932" y="738" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Contreplaqué d’une seule plaque (bouleau à l’origine ; ici</text><text x="932" y="756" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">contreplaqué marine CTBX)</text><text x="932" y="776" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Pièces emboîtées sans vis, clou ni colle</text><text x="932" y="796" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Vernis ou peinture d’extérieur, coussins en toile crème</text><text x="932" y="816" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Volume dessiné d’après les mesures d’une revente : à vérifier sur un</text><text x="932" y="834" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">exemplaire</text><text x="920" y="864" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8b8a86" text-anchor="start">FABRICATION LOCALE</text><text x="932" y="884" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Découpe à la commande numérique, ou à la scie sauteuse sur gabarit</text><text x="932" y="904" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Atelier de menuiserie à Abidjan ; série de 5 à 6 chaises</text><text x="932" y="924" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Œuvre protégée par le droit d’auteur : accord d’Issa Diabaté, de Kevin</text><text x="932" y="942" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">Gouriou et d’IKEA avant toute fabrication locale</text><text x="932" y="962" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Rentrées la nuit ou protégées de la pluie</text><text x="920" y="992" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8b8a86" text-anchor="start">RÉFÉRENCES ÉTUDIÉES</text><text x="932" y="1012" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2a2622" text-anchor="start">R13 · IKEA et Design Indaba, collection ÖVERALLT, 2019 (Dezeen)</text><text x="944" y="1028" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b0582b" text-anchor="start">→ La chaise d’Issa Diabaté : une plaque de contreplaqué, sans fixation,</text><text x="944" y="1044" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b0582b" text-anchor="start">basse pour la conversation</text><text x="932" y="1064" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2a2622" text-anchor="start">R14 · Fauteuil ÖVERALLT, I. Diabaté et K. Gouriou pour IKEA, 2019</text><text x="932" y="1080" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2a2622" text-anchor="start">(Chairish)</text><text x="944" y="1096" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b0582b" text-anchor="start">→ Mesures d’une revente : assise à 30 cm, hauteur 63 cm, 70 × 65 cm au sol</text><text x="932" y="1116" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2a2622" text-anchor="start">R15 · IKEA lance sa collection made in Africa, Design Indaba 2019</text><text x="932" y="1132" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2a2622" text-anchor="start">(Domus)</text><text x="944" y="1148" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b0582b" text-anchor="start">→ Contreplaqué de bouleau, co-conception avec Kevin Gouriou</text><text x="932" y="1168" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2a2622" text-anchor="start">R16 · Exposition « Local Art Brut », Macline Hien et Issa Diabaté</text><text x="932" y="1184" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2a2622" text-anchor="start">(galerie Louis Simone Guirandou, Abidjan)</text><text x="944" y="1200" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b0582b" text-anchor="start">→ Meubles inspirés des tabourets en bois, trônes et chaises de gardien :</text><text x="944" y="1216" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b0582b" text-anchor="start">piste pour les tabourets</text></svg>