xt-anchor="start">M03 · Banquette et table de réunion</text><text x="70" y="78" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b8a86" text-anchor="start">Désiré Akai · fiche mobilier · V8 indice B · modèle d'étude à prototyper, cotes en mètres</text><text x="920" y="620" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2a2622" text-anchor="start">Pour loger 9 personnes dans 8,4 m² : une banquette continue de 5</text><text x="920" y="641" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2a2622" text-anchor="start">places contre la baie, et une table longue sur piètement en</text><text x="920" y="662" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2a2622" text-anchor="start">compas.</text><text x="920" y="697" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8b8a86" text-anchor="start">MATIÈRES</text><text x="932" y="717" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Banquette : assise et dossier en mousse haute résilience, velours</text><text x="932" y="735" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">cognac</text><text x="932" y="755" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Coutures verticales tous les 0,56 m (5 places)</text><text x="932" y="775" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Socle en noyer en retrait ; table 2,50 × 0,80, plateau noyer</text><text x="932" y="795" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Piètement en V « compas », entretoise basse</text><text x="920" y="825" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8b8a86" text-anchor="start">FABRICATION LOCALE</text><text x="932" y="845" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Menuisier pour le socle et la table, tapissier pour la banquette</text><text x="932" y="865" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Velours traité anti-taches, déhoussable</text><text x="932" y="885" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Prise et boîte de sol sous la table pour les ordinateurs</text><text x="920" y="915" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8b8a86" text-anchor="start">RÉFÉRENCES ÉTUDIÉES</text><text x="932" y="935" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2a2622" text-anchor="start">R05 · George Nakashima, Conoid Bench, 1960 (Baltimore Museum of Art)</text><text x="944" y="951" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b0582b" text-anchor="start">→ Banc long en noyer, assise d'un seul tenant, dossier léger</text><text x="932" y="971" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2a2622" text-anchor="start">R06 · Pierre Jeanneret, fauteuil à jambes en compas PJ-SI-29-A (Merit)</text><text x="944" y="987" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b0582b" text-anchor="start">→ Le piètement en V repris pour la table de réunion</text></svg>