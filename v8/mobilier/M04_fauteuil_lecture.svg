ca, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Coussins en velours cognac ou olive, déhoussables</text><text x="932" y="777" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Accoudoirs en bois massif, finition huilée</text><text x="920" y="807" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8b8a86" text-anchor="start">FABRICATION LOCALE</text><text x="932" y="827" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Ébéniste pour la structure, vannier pour le cannage</text><text x="932" y="847" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Assise à 0,40 m, profondeur utile 0,55 m</text><text x="932" y="867" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Prototype d’un exemplaire avant la série de quatre</text><text x="920" y="897" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8b8a86" text-anchor="start">RÉFÉRENCES ÉTUDIÉES</text><text x="932" y="917" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2a2622" text-anchor="start">R07 · Pierre Jeanneret, Office Cane Chair, bibliothèque de Chandigarh,</text><text x="932" y="933" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2a2622" text-anchor="start">1955-1956 (Vitra Design Museum)</text><text x="944" y="949" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b0582b" text-anchor="start">→ Teck et cannage dans une bibliothèque publique : la référence la plus</text><text x="944" y="965" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b0582b" text-anchor="start">proche du programme</text><text x="932" y="985" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2a2622" text-anchor="start">R08 · Sergio Rodrigues, fauteuil Mole, 1957 (Metropolitan Museum of Art)</text><text x="944" y="1001" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b0582b" text-anchor="start">→ Fauteuil bas, coussins généreux : le confort pour lire longtemps</text></svg>