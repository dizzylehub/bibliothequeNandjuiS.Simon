ont-family="Archivo, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#2a2622">jonction : la table se divise en deux pour des ateliers.</text><text x="630" y="714" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#2a2622">Pieds-lames en retrait, goulotte à câbles en laiton sous le</text><text x="630" y="734" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#2a2622">plateau.</text><text x="630" y="768.0" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8b8a86">POUR</text><text x="640" y="783" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3f7a4a">+ Histoire locale, forme mémorable</text><text x="640" y="801" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3f7a4a">+ Divisible pour la location</text><text x="640" y="819" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3f7a4a">+ Câbles cachés</text><text x="630" y="845.4" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8b8a86">CONTRE</text><text x="640" y="861" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#b0582b">– Extrémités effilées : pas de place en bout de table</text><line x1="1576.4" y1="325.9" x2="1620.0" y2="231.9" stroke="#2b2b2b" stroke-width="5.0" stroke-linecap="round"/><line x1="1649.1" y1="317.5" x2="1590.9" y2="283.9" stroke="#2b2b2b" stroke-width="3.4" stroke-linecap="round"/><line x1="1663.6" y1="376.3" x2="1620.0" y2="231.9" stroke="#2b2b2b" stroke-width="5.0" stroke-linecap="round"/><polygon points="1519.6,350.3 1700.0,246.1 1583.6,178.9 1403.3,283.1" fill="#a8754a" fill-opacity="1" stroke="#2a2622" stroke-width="0.5" style="filter:brightness(1.0)"/><polygon points="1519.6,357.0 1700.0,252.9 1700.0,246.1 1519.6,350.3" fill="#a8754a" fill