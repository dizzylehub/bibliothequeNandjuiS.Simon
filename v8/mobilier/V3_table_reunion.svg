e="14" font-weight="400" fill="#2a2622">Deux tables de 1,25 m sur tréteaux en acier, à assembler en</text><text x="1200" y="674" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#2a2622">long, en T ou en salle de classe.</text><text x="1200" y="708.0" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8b8a86">POUR</text><text x="1210" y="723" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3f7a4a">+ La plus modulable</text><text x="1210" y="741" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3f7a4a">+ Économique</text><text x="1200" y="767.4" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8b8a86">CONTRE</text><text x="1210" y="783" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#b0582b">– Moins de caractère</text><text x="1210" y="801" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#b0582b">– Aspect provisoire</text><text x="60" y="1095" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2a2622">Recommandation de l’équipe : « Pirogue » : une table signature, qui se divise quand même en deux pour les ateliers de location, et qui garde les 9</text><text x="60" y="1117" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2a2622">places.</text></svg>