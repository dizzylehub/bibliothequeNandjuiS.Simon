htness(0.68)"/><line x1="1150.0" y1="303.7" x2="1146.9" y2="226.0" stroke="#7a4a2a" stroke-width="6.3" stroke-linecap="round"/><text x="70" y="52" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#2a2622" text-anchor="start">M05 · Chaise de table d'hôtes et de réunion</text><text x="70" y="78" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b8a86" text-anchor="start">Désiré Akai · fiche mobilier · V8 indice B · modèle d'étude à prototyper, cotes en mètres</text><text x="920" y="620" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2a2622" text-anchor="start">Une chaise légère, empilable dans l'idée, au dossier en bandeau :</text><text x="920" y="641" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2a2622" text-anchor="start">la sobriété des chaises danoises, l'assise tressée des artisans</text><text x="920" y="662" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#2a2622" text-anchor="start">d'ici.</text><text x="920" y="697" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8b8a86" text-anchor="start">MATIÈRES</text><text x="932" y="717" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Bois dur local massif, assemblages tenon-mortaise</text><text x="932" y="737" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Assise tressée (corde de papier, raphia ou fibre plastique)</text><text x="932" y="757" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Dossier en bandeau courbe</text><text x="932" y="777" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Finition huile dure</text><text x="920" y="807" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8b8a86" text-anchor="start">FABRICATION LOCALE</text><text x="932" y="827" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Série de 10 à 12 chaises (table d'hôtes, réunion, postes)</text><text x="932" y="847" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Assise à 0,45 m pour des tables à 0,75 m</text><text x="932" y="867" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2a2622" text-anchor="start">· Vannerie confiée à un atelier local</text><text x="920" y="897" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8b8a86" text-anchor="start">RÉFÉRENCES ÉTUDIÉES</text><text x="932" y="917" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2a2622" text-anchor="start">R09 · Hans J. Wegner, CH24 Wishbone Chair, 1949 (Skandium)</text><text x="944" y="933" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b0582b" text-anchor="start">→ Assise tressée, 55 × 51 × 76 cm, assise à 45 cm</text><text x="932" y="953" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2a2622" text-anchor="start">R10 · Jean Servais Somian, ébéniste et designer ivoirien (Forbes</text><text x="932" y="969" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2a2622" text-anchor="start">Afrique)</text><text x="944" y="985" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b0582b" text-anchor="start">→ Bois local (cocotier) travaillé à Abidjan : une collaboration possible</text><text x="944" y="1001" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b0582b" text-anchor="start">pour une pièce signature</text></svg>